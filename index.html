<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New chat - Claude</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23262626'/%3E%3Cg stroke='%23d97757' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M32 8v12M32 44v12M8 32h12M44 32h12M15 15l9 9M40 40l9 9M49 15l-9 9M24 40l-9 9'/%3E%3C/g%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #141414;
      --card-bg: #202020;
      --card-border: #343434;
      --text: #f0efec;
      --muted: #858585;
      --accent: #d97757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
    }

    body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
      background: var(--page-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Small, quiet controls in the two top corners. */
    .header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      pointer-events: none;
    }

    .icon-btn-top {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #d0d0d0;
      cursor: pointer;
      pointer-events: auto;
    }

    .icon-btn-top:hover {
      background: #282828;
      color: #fff;
    }

    .icon-btn-top svg {
      display: block;
      width: 16px;
      height: 16px;
    }

    /* The hero is deliberately positioned a little above the viewport center,
       matching the reference screenshot rather than centering on the full page. */
    .main-container {
      position: absolute;
      top: 32.4%;
      left: 50%;
      transform: translateX(-50%);
      width: min(587px, calc(100vw - 32px));
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      height: 38px;
      margin-bottom: 33px;
      white-space: nowrap;
    }

    .brand-icon {
      display: block;
      flex: 0 0 35px;
      width: 35px;
      height: 35px;
      color: var(--accent);
    }

    .brand-title {
      color: #f1efeb;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 37px;
      font-weight: 400;
      line-height: 1.04;
      letter-spacing: -1.05px;
    }

    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-height: 360px;
      overflow-y: auto;
      margin-bottom: 14px;
      padding-right: 5px;
      scrollbar-width: thin;
      scrollbar-color: #414141 transparent;
    }

    .chat-messages:empty {
      display: none;
    }

    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      border-radius: 5px;
      background: #414141;
    }

    .message {
      display: flex;
      width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      background: #292929;
      color: var(--text);
      border-bottom-right-radius: 5px;
    }

    .message.assistant .bubble {
      background: #202020;
      color: var(--text);
      border: 1px solid #343434;
      border-bottom-left-radius: 5px;
    }

    /* Composer: 587 x 95 px at the reference viewport. */
    .input-card {
      width: 100%;
      height: 95px;
      flex: 0 0 95px;
      padding: 10px 13px 8px;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      background: var(--card-bg);
      box-shadow: none;
      transition: border-color 160ms ease;
    }

    .input-card:focus-within {
      border-color: #454545;
    }

    .input-card textarea {
      display: block;
      width: 100%;
      height: 41px;
      resize: none;
      overflow-y: auto;
      padding: 2px 0 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      line-height: 1.45;
    }

    .input-card textarea::placeholder {
      color: #818181;
      opacity: 1;
    }

    .card-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 30px;
      min-width: 0;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .toolbar-left {
      gap: 3px;
    }

    .btn-icon {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #dedede;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease;
    }

    .btn-icon:hover {
      background: #303030;
      color: #fff;
    }

    .btn-icon svg {
      display: block;
      width: 16px;
      height: 16px;
    }

    .add-btn {
      width: 27px;
      font-size: 24px;
      font-weight: 300;
      line-height: 1;
    }

    .mode-switch {
      display: flex;
      align-items: center;
      gap: 1px;
      padding: 2px;
      border-radius: 8px;
      background: #262626;
    }

    .pill-tab {
      height: 24px;
      padding: 0 9px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: #c5c5c5;
      font: inherit;
      font-size: 12px;
      line-height: 22px;
      cursor: pointer;
      white-space: nowrap;
    }

    .pill-tab.active {
      border-color: #474747;
      background: #3a3a3a;
      color: #f5f5f5;
    }

    .pill-tab:hover:not(.active) {
      color: #fff;
    }

    .toolbar-right {
      gap: 7px;
    }

    .model-label {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-right: 5px;
      white-space: nowrap;
      font-size: 12px;
      line-height: 1;
    }

    .model-name {
      color: #dedede;
    }

    .model-level {
      color: #7d8793;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .audio-controls .btn-icon {
      width: 23px;
    }

    .audio-controls .chevron-btn {
      width: 13px;
      color: #8f8f8f;
    }

    .send-btn {
      display: none;
      width: 29px;
      height: 29px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    .send-btn:hover {
      background: #c86c4c;
    }

    .send-btn svg {
      width: 15px;
      height: 15px;
    }

    .input-card.has-text .audio-controls {
      display: none;
    }

    .input-card.has-text .send-btn {
      display: inline-flex;
    }

    @media (max-width: 520px) {
      .main-container {
        top: 29%;
        width: calc(100vw - 28px);
      }

      .brand {
        margin-bottom: 28px;
      }

      .brand-title {
        font-size: 33px;
      }

      .brand-icon {
        flex-basis: 31px;
        width: 31px;
        height: 31px;
      }

      .model-label {
        gap: 3px;
        margin-right: 0;
        font-size: 10px;
      }

      .toolbar-right {
        gap: 3px;
      }

      .toolbar-left {
        gap: 1px;
      }

      .pill-tab {
        padding-inline: 7px;
        font-size: 11px;
      }
    }

    @media (max-height: 560px) {
      .main-container {
        top: 22%;
      }

      .brand {
        margin-bottom: 22px;
      }

      .chat-messages {
        max-height: 180px;
      }
    }
  </style>
</head>
<body>
  <header class="header" aria-label="Top navigation">
    <button class="icon-btn-top" type="button" title="Sidebar" aria-label="Open sidebar">
      <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <rect x="3" y="3.25" width="12" height="11.5" rx="1.2" stroke="currentColor" stroke-width="1.1" />
        <path d="M6.5 3.7v10.6" stroke="currentColor" stroke-width="1.1" />
      </svg>
    </button>
    <button class="icon-btn-top" type="button" title="Help" aria-label="Help">
      <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M3 14.8V7.3a6 6 0 0 1 12 0v7.5l-2.5-1.5-2.5 1.5-2.5-1.5L5 14.8 3 14.8Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round" />
        <circle cx="6.8" cy="7.8" r=".65" fill="currentColor" />
        <circle cx="11.2" cy="7.8" r=".65" fill="currentColor" />
      </svg>
    </button>
  </header>

  <main class="main-container">
    <div class="brand" id="brandSection" aria-label="Let's noodle">
      <svg class="brand-icon" viewBox="0 0 36 36" fill="none" aria-hidden="true">
        <g stroke="currentColor" stroke-width="3.1" stroke-linecap="round">
          <path d="M18 2.3v7.1M18 26.6v7.1M2.3 18h7.1M26.6 18h7.1" />
          <path d="M6.9 6.9l5 5M24.1 24.1l5 5M29.1 6.9l-5 5M11.9 24.1l-5 5" />
          <path d="M12.1 3.9l2.4 6.8M21.5 25.3l2.4 6.8M3.9 12.1l6.8 2.4M25.3 21.5l6.8 2.4" />
          <path d="M23.9 3.9l-2.4 6.8M14.5 25.3l-2.4 6.8M32.1 12.1l-6.8 2.4M10.7 21.5l-6.8 2.4" />
        </g>
      </svg>
      <h1 class="brand-title">Let’s noodle</h1>
    </div>

    <div class="chat-messages" id="chatMessages" aria-live="polite"></div>

    <form class="input-card" id="composer" onsubmit="sendMessage(event)">
      <textarea id="userInput" rows="1" placeholder="How can I help you today?" aria-label="Message" autocomplete="off"></textarea>
      <div class="card-toolbar">
        <div class="toolbar-group toolbar-left">
          <button class="btn-icon add-btn" type="button" title="Add attachment" aria-label="Add attachment">+</button>
          <div class="mode-switch" role="group" aria-label="Mode">
            <button class="pill-tab active" type="button" aria-pressed="true">Chat</button>
            <button class="pill-tab" type="button" aria-pressed="false">Cowork</button>
          </div>
        </div>

        <div class="toolbar-group toolbar-right">
          <div class="model-label" aria-label="Opus 5.5 Medium">
            <span class="model-name">Opus 5.5</span>
            <span class="model-level">Medium</span>
          </div>
          <div class="audio-controls">
            <button class="btn-icon" type="button" title="Voice input" aria-label="Voice input">
              <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <rect x="6.4" y="2.2" width="5.2" height="9.1" rx="2.6" stroke="currentColor" stroke-width="1.45" />
                <path d="M4.3 8.5a4.7 4.7 0 0 0 9.4 0M9 13.2v2.5M6.6 15.7h4.8" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
              </svg>
            </button>
            <button class="btn-icon" type="button" title="Voice mode" aria-label="Voice mode">
              <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M2.5 7v4M5.3 4.5v9M8.1 2.8v12.4M10.9 5.2v7.6M13.7 3.9v10.2M16 7v4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
              </svg>
            </button>
            <button class="btn-icon chevron-btn" type="button" title="More voice options" aria-label="More voice options">
              <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="m3.5 5.3 3.5 3.4 3.5-3.4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <button class="send-btn" id="sendBtn" type="submit" title="Send message" aria-label="Send message">
            <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M3.3 9h10.8M9 3.9l5.1 5.1L9 14.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </div>
    </form>
  </main>

  <script>
    const RESPONSE_TEXT = "กูไม่บอก บอกแล้วเอาไรแดก";

    const input = document.getElementById("userInput");
    const composer = document.getElementById("composer");
    const chatMessages = document.getElementById("chatMessages");

    function sendMessage(event) {
      if (event) event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const userMsg = document.createElement("div");
      userMsg.className = "message user";
      const userBubble = document.createElement("div");
      userBubble.className = "bubble";
      userBubble.textContent = text;
      userMsg.appendChild(userBubble);
      chatMessages.appendChild(userMsg);

      input.value = "";
      updateComposerState();
      chatMessages.scrollTop = chatMessages.scrollHeight;

      window.setTimeout(() => {
        const assistantMsg = document.createElement("div");
        assistantMsg.className = "message assistant";
        const assistantBubble = document.createElement("div");
        assistantBubble.className = "bubble";
        assistantBubble.textContent = RESPONSE_TEXT;
        assistantMsg.appendChild(assistantBubble);
        chatMessages.appendChild(assistantMsg);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 600);
    }

    function updateComposerState() {
      composer.classList.toggle("has-text", input.value.trim().length > 0);
    }

    input.addEventListener("input", updateComposerState);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(event);
      }
    });
  </script>
</body>
</html>
